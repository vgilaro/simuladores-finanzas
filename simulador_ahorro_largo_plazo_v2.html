<script>
(function(){
 const $=id=>document.getElementById(id);
 const euro=new Intl.NumberFormat('es-ES',{
   style:'currency',
   currency:'EUR',
   maximumFractionDigits:0
 });

 function num(id){
   return Number($(id).value)
 }

 function calc(){

  const ea=num('edadActual'),
        es=num('edadAhorro'),
        eo=num('edadObjetivo'),
        am=num('ahorroMensual'),
        ae=num('ahorroExtra'),
        ce=num('cantidadExtra'),
        r=num('tasa')/100;

  const err=$('error');
  err.style.display='none';
  err.textContent='';

  if(
    ![ea,es,eo,am,ae,ce,r].every(Number.isFinite) ||
    ea<0 ||
    es<=ea ||
    eo<es ||
    am<0 ||
    ae<0 ||
    ce<0 ||
    !Number.isInteger(ce) ||
    r<0
  ){
    err.textContent='Revisa los datos: la edad de fin de ahorro debe ser mayor que la edad actual, la edad objetivo no puede ser menor y la cantidad de aportes extraordinarios debe ser un número entero no negativo.';
    err.style.display='block';
    return;
  }

  const mesesAhorro=Math.round((es-ea)*12),
        mesesTotal=Math.round((eo-ea)*12),
        maxExtra=Math.floor(mesesAhorro/12);

  if(ce>maxExtra){
    err.textContent='Con este período de ahorro pueden realizarse como máximo '+maxExtra+' aportes extraordinarios, suponiendo uno al final de cada año.';
    err.style.display='block';
    return;
  }

  let saldo=0,
      total=0,
      finAhorro=0,
      extrasHechos=0;

  for(let m=1;m<=mesesTotal;m++){

    saldo*=1+r;

    if(m<=mesesAhorro){

      saldo+=am;
      total+=am;

      if(m%12===0 && extrasHechos<ce){
        saldo+=ae;
        total+=ae;
        extrasHechos++;
      }
    }

    if(m===mesesAhorro){
      finAhorro=saldo;
    }
  }

  const rend=saldo-total,
        pA=saldo>0 ? total/saldo*100 : 0,
        pR=saldo>0 ? rend/saldo*100 : 0;

  $('capitalFinal').textContent=euro.format(saldo);
  $('totalAportado').textContent=euro.format(total);
  $('rendimientos').textContent=euro.format(rend);
  $('capitalFinAhorro').textContent=euro.format(finAhorro);
  $('anosSinAporte').textContent=(eo-es)+' años';

  $('lblFinal').textContent=
    'Capital acumulado a los '+eo+' años';

  $('lblFinAhorro').textContent=
    'Capital al dejar de ahorrar a los '+es+' años';

  $('barAportado').style.width=
    Math.max(0,Math.min(100,pA))+'%';

  $('barRend').style.width=
    Math.max(0,Math.min(100,pR))+'%';

  $('pctAportado').textContent=
    pA.toFixed(1).replace('.',',')+'%';

  $('pctRend').textContent=
    pR.toFixed(1).replace('.',',')+'%';

  const anosCapital=eo-es;

  $('mensaje').textContent=
    anosCapital>0
    ? 'Durante el período de ahorro realizas '
      +mesesAhorro+
      ' aportes mensuales y '
      +ce+
      ' aporte'+(ce===1?'':'s')+
      ' extraordinario'+(ce===1?'':'s')+
      '. Después de dejar de aportar, el capital permanece '
      +anosCapital+
      ' años generando rendimientos.'
    : 'En este escenario realizas aportes hasta la edad objetivo.';
 }

 // El cálculo se actualiza únicamente al presionar el botón.
 $('calcular').addEventListener('click',calc);

 // Muestra el escenario inicial al abrir el simulador.
 calc();

})();
</script>
